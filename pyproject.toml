[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hop2"
version = "1.0.0"
description = "Quick directory and command aliasing for the terminal"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
hop2 = "hop2:main"

[tool.setuptools]
py-modules = ["hop2"]
